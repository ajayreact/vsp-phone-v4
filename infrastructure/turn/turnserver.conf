# RC3 — optional TURN for corporate NAT (profile: turn)
# Set WEBRTC_TURN_URL=turn:your-host:3478 and matching credentials in .env

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=vspphone.com
server-name=vspphone.com
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
log-file=stdout
verbose

# Replace with production static auth secret or use TURN REST (ADR-040 deferred)
user=vsp:changeme-turn-password

min-port=49152
max-port=49252

# Uncomment for TLS TURN
# cert=/etc/coturn/fullchain.pem
# pkey=/etc/coturn/privkey.pem
