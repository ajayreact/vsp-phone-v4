;
; VSP Phone v4 — Asterisk PJSIP (ADR-045: B2BUA carrier core behind Kamailio edge)
;
; This file is a template. infrastructure/docker/asterisk/docker-entrypoint.sh renders
; it into /etc/asterisk/pjsip.conf, substituting the placeholder tokens from the environment.
; The entrypoint aborts if any placeholder token survives rendering, so do not mention one
; in a comment.
;
; Two endpoints, two dialogs — that is the entire point of this file:
;   kamailio : UAS side. Desk calls arrive here from the Kamailio edge proxy.
;   telnyx   : UAC side. Asterisk originates a NEW dialog (own Call-ID/tags/CSeq/Contact)
;              and therefore ACKs Telnyx's 200 OK itself, with no dependency on the
;              desk phone's ACK. That is what removes the Telnyx ACK-timeout teardown.
;
; Asterisk never talks to Telnyx directly: outbound_proxy sends the carrier leg back
; through Kamailio, which stays the only public-facing SIP element and anchors media in
; RTPengine. Asterisk therefore needs no published ports and no NAT address of its own.
;

[transport-internal]
type=transport
protocol=udp
bind=0.0.0.0:__ASTERISK_SIP_PORT__

; ---------------------------------------------------------------------------
; Kamailio edge — desk leg (Asterisk is the UAS)
; ---------------------------------------------------------------------------

[kamailio-aor]
type=aor
contact=sip:__KAMAILIO_HOST__:__KAMAILIO_INTERNAL_PORT__

[kamailio]
type=endpoint
context=vsp-outbound
transport=transport-internal
aors=kamailio-aor
disallow=all
allow=ulaw,alaw,g722
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
; RFC 4028 — Asterisk owns session refresh on both legs.
timers=yes
timers_min_se=90
timers_sess_expires=1800
trust_id_inbound=yes
send_pai=yes
language=en

[kamailio-identify]
type=identify
endpoint=kamailio
match=__KAMAILIO_HOST__
; Compose bridge networks allocate from the Docker private pool; port 5080 is not
; published to the host, so nothing outside vsp_internal can reach this transport.
match=172.16.0.0/12

; ---------------------------------------------------------------------------
; Telnyx trunk — carrier leg (Asterisk is the UAC)
; ---------------------------------------------------------------------------

[telnyx-auth]
type=auth
auth_type=userpass
username=__TELNYX_SIP_USERNAME__
password=__TELNYX_SIP_PASSWORD__

[telnyx-aor]
type=aor
contact=sip:__TELNYX_SIP_HOST__:5060

[telnyx]
type=endpoint
context=vsp-from-telnyx
transport=transport-internal
aors=telnyx-aor
; Digest auth for the 401/407 challenge is handled by Asterisk's own transaction
; layer — no script-level retry, no CSeq surgery.
outbound_auth=telnyx-auth
; Semicolons start a comment in this file, so the ;lr URI parameter must be escaped.
outbound_proxy=sip:__KAMAILIO_HOST__:__KAMAILIO_INTERNAL_PORT__\;lr
from_domain=__TELNYX_SIP_HOST__
; Telnyx AnchorSite selection keys off the connection username in Contact.
contact_user=__TELNYX_SIP_USERNAME__
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no
dtmf_mode=rfc4733
timers=yes
timers_min_se=90
timers_sess_expires=1800
send_rpid=yes
send_pai=yes
trust_id_outbound=yes
language=en
