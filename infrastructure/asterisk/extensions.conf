;
; VSP Phone v4 — Asterisk dialplan (ADR-045)
;
; Asterisk is deliberately a dumb bridge here. All tenant policy, CLI selection and
; destination normalisation already happened in NestJS and reached us as X-headers on
; the INVITE from Kamailio. Asterisk's only job is to terminate the desk dialog and
; originate an independent carrier dialog.
;

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]

; ---------------------------------------------------------------------------
; Desk leg in — from the Kamailio edge
; ---------------------------------------------------------------------------
[vsp-outbound]
exten => _+X.,1,Gosub(vsp-pstn,dial,1(${EXTEN}))
	same => n,Hangup()

exten => _X.,1,Gosub(vsp-pstn,dial,1(${EXTEN}))
	same => n,Hangup()

exten => i,1,NoOp(VSP invalid destination ${EXTEN})
	same => n,Hangup(1)

; ---------------------------------------------------------------------------
; Carrier leg out — new dialog toward Telnyx
; ---------------------------------------------------------------------------
[vsp-pstn]
exten => dial,1,NoOp(VSP PSTN ${ARG1} from ${CHANNEL(endpoint)})
	same => n,Set(VSP_CLI=${PJSIP_HEADER(read,X-VSP-CLI)})
	same => n,Set(VSP_CLI_NAME=${PJSIP_HEADER(read,X-VSP-CLI-Name)})
	; Double underscore: the pre-dial handler runs on the outbound channel and only
	; sees variables marked for inheritance.
	same => n,Set(__VSP_UUID=${PJSIP_HEADER(read,X-VSP-Platform-UUID)})
	same => n,ExecIf($["${VSP_CLI}" != ""]?Set(CALLERID(num)=${VSP_CLI}))
	same => n,ExecIf($["${VSP_CLI_NAME}" != ""]?Set(CALLERID(name)=${VSP_CLI_NAME}))
	same => n,NoOp(VSP carrier dial ${ARG1} cli=${CALLERID(num)} uuid=${VSP_UUID})
	same => n,Dial(PJSIP/${ARG1}@telnyx,300,b(vsp-pstn^addhdr^1))
	same => n,NoOp(VSP carrier result ${DIALSTATUS} cause=${HANGUPCAUSE})
	same => n,Hangup()

; Pre-dial handler: runs on the carrier channel before the INVITE leaves.
exten => addhdr,1,NoOp(VSP carrier leg headers)
	same => n,ExecIf($["${VSP_UUID}" != ""]?Set(PJSIP_HEADER(add,X-VSP-Platform-UUID)=${VSP_UUID}))
	; Marks this INVITE as Asterisk egress so the Kamailio edge routes it to the
	; carrier instead of back through tenant routing. Kamailio strips it before Telnyx.
	same => n,Set(PJSIP_HEADER(add,X-VSP-Egress)=telnyx)
	same => n,Return()

; ---------------------------------------------------------------------------
; Reserved for phase 2 (inbound DID delivery via Asterisk). Inbound currently
; terminates on Kamailio and never reaches this context.
; ---------------------------------------------------------------------------
[vsp-from-telnyx]
exten => _[+0-9].,1,NoOp(VSP inbound ${EXTEN} — not handled by Asterisk in phase 1)
	same => n,Hangup(38)
