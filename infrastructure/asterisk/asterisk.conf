;
; VSP Phone v4 — Asterisk core (ADR-045)
;
[directories]
astetcdir => /etc/asterisk
; Ubuntu builds Asterisk with a multiarch libdir, so the module directory is
; /usr/lib/<triplet>/asterisk/modules and not the upstream default. The entrypoint
; detects the real path at start-up; hardcoding it here loads zero modules.
astmoddir => __ASTERISK_MODULE_DIR__
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /usr/share/asterisk
astagidir => /usr/share/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
debug = 0
documentation_language = en_US
; Container runs one process in the foreground; Docker owns supervision.
nofork = yes
hideconnect = yes
lockmode = flock
