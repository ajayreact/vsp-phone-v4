;
; VSP Phone v4 — RTP (ADR-045)
;
; Media on both legs is anchored by RTPengine under Kamailio control, so Asterisk only
; ever exchanges RTP with RTPengine inside vsp_internal. No public address, no ICE.
;
[general]
rtpstart=__ASTERISK_RTP_PORT_MIN__
rtpend=__ASTERISK_RTP_PORT_MAX__
icesupport=no
strictrtp=yes
rtpchecksums=no
