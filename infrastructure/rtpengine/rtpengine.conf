[rtpengine]
## VSP Phone v4 — Phase 4 + Phase 9 RTPengine Configuration (IMP-S5-P4-001 / P9-001)
## Phase 9: offer/answer/delete wired from Kamailio; recording pipeline still deferred.

foreground = true
log-stderr = true
log-level = 6
table = -1

listen-ng = 0.0.0.0:2223
listen-cli = 127.0.0.1:2224

# Media interface label for later direction flags (TEL-RTP-001)
interface = internal/eth0

port-min = 10000
port-max = 10099

timeout = 60
silent-timeout = 3600
final-timeout = 10800
delete-delay = 30
tos = 184
max-sessions = 5000

# Media crypto / ICE (Phase 9 — flags from Kamailio offer/answer)
# Real rtpengine-daemon: RTP + SDES-SRTP + DTLS-SRTP + ICE when SDP / NG flags demand.
# Stub backend answers NG control only; two-way audio requires rtpengine-daemon on Docker host.

# STUN assist for ICE gathering (optional; TURN deferred)
# Uncomment when the packaged daemon supports this key (see --help):
# stun-server = stun.l.google.com:19302

# Recording directory prepared; do NOT start recording in Phase 4
recording-dir = /var/spool/rtpengine
recording-method = proc
