[rtpengine]
## VSP Phone v4 — RC3 production media configuration
## Userspace forwarding (table=-1) when kernel module unavailable; real daemon required for audio.

foreground = true
log-stderr = true
log-level = 6
table = -1

listen-ng = 0.0.0.0:2223
listen-cli = 127.0.0.1:2224

# Two logical interfaces on the same NIC (ADR-045). "external" advertises the public
# address for phones and Telnyx; "internal" keeps the container address for the
# Asterisk B2BUA core, which cannot reach the public IP (no VPC hairpin).
# The advertised address is applied at runtime from RTPENGINE_ADVERTISE.
interface = internal/eth0
interface = external/eth0

port-min = 10000
port-max = 10099

timeout = 60
silent-timeout = 3600
final-timeout = 10800
delete-delay = 30
tos = 184
max-sessions = 5000

# ICE / DTLS-SRTP negotiated via Kamailio offer/answer flags (Phase 9)
# Optional STUN assist — uncomment when daemon supports it:
# stun-server = stun.l.google.com:19302

recording-dir = /var/spool/rtpengine
recording-method = proc
