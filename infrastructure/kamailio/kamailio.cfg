#!KAMAILIO
#
# VSP Phone v4 — Kamailio (Phase 3 base + Phase 6 REGISTER + Phase 7 INVITE + Phase 9 media + Phase 10 WSS)
# Remediation: service auth headers, APP_MEDIA, routing/continue, configurable usrloc persistence
# Phases 1–8 foundations retained. Phase 9 adds RTPengine offer/answer/delete.
#
# Phase 6 owns:
#   REGISTER digest challenge → NestJS /auth/sip-digest → usrloc save
#   NestJS /register|/unregister notify (Redis mirror + events)
#
# Phase 7 owns:
#   INVITE → NestJS /routing/resolve → FORK + X-VSP-Platform-UUID
#
# Phase 8 owns:
#   BRIDGE_CARRIER → Telnyx dispatcher set 2
#
# Phase 9 owns:
#   rtpengine_offer / rtpengine_answer / rtpengine_delete (TEL-RTP-001)
#   platformUuid media correlation → NestJS /media/lifecycle (Redis only)
#
# Phase 10 owns:
#   WSS REGISTER Path (ADR-039), strip untrusted X-VSP-* from browser signaling
#
# Does NOT:
#   Recording pipeline/UI, conference, queue/IVR media, codec policy, AI features.
#

#!define WITH_DEBUG
#!define WITH_TLS
#!define WITH_WEBSOCKET
#!define WITH_NAT
#!define WITH_ANTIFLOOD
#!define WITH_DISPATCHER
#!define WITH_RTPENGINE
#!define WITH_AUTH_FRAMEWORK
#!define WITH_NESTJS_AUTH
#!define RC1_SIP_DIGEST_TRACE
#!define NESTJS_BASE_URL "http://api:3000"
# Injected at container start — docker-entrypoint.sh replaces __VSP_SERVICE_AUTH_TOKEN__
#!define VSP_SERVICE_AUTH_TOKEN "__VSP_SERVICE_AUTH_TOKEN__"
#!define VSP_SERVICE_AUTH_HEADER "X-VSP-Service-Auth: __VSP_SERVICE_AUTH_TOKEN__\r\n"
#!define FLB_NATB 5

# ###############################
# ### Core process & logging  ###
# ###############################

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
memdbg=5
memlog=5
log_prefix="{$mt $hdr(CSeq) $ci} "

fork=yes
children=4
tcp_children=4
enable_tls=yes
tcp_connection_lifetime=3605
tcp_accept_no_cl=yes
tcp_rd_buf_size=16384
tcp_clone_rcvbuf=1
async_workers=4
auto_aliases=no
user_agent_header="User-Agent: VSP-Phone-v4-Kamailio"
server_header="Server: VSP-Phone-v4"

/* Advertise for Record-Route / Path later — overridden by env in production */
alias="sip.localhost"
alias="localhost"

# ###############################
# ### Listeners               ###
# ###############################

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

#!ifdef WITH_TLS
listen=tls:0.0.0.0:5061
#!endif

#!ifdef WITH_WEBSOCKET
# Plain WS (lab) + WSS on TLS port (ADR-039)
listen=tcp:0.0.0.0:8080
#!ifdef WITH_TLS
listen=tls:0.0.0.0:8443
#!endif
#!endif

# Lightweight HTTP health (xhttp) — not public SIP
listen=tcp:0.0.0.0:8880

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

# ###############################
# ### Module loading          ###
# ###############################

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "sdpops.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "counters.so"
loadmodule "htable.so"

#!ifdef WITH_TLS
loadmodule "tls.so"
#!endif

loadmodule "xhttp.so"

#!ifdef WITH_WEBSOCKET
loadmodule "websocket.so"
#!endif

# Registrar foundation (memory usrloc — Redis in later phase)
loadmodule "usrloc.so"
loadmodule "registrar.so"

# Digest auth framework; NestJS verifies HA1 (Phase 6)
#!ifdef WITH_AUTH_FRAMEWORK
loadmodule "auth.so"
#!endif

#!ifdef WITH_NESTJS_AUTH
loadmodule "http_client.so"
loadmodule "jansson.so"
#!endif

# ACL / address permissions
loadmodule "permissions.so"

#!ifdef WITH_DISPATCHER
loadmodule "dispatcher.so"
#!endif

# Dialog tracking (foundation; business CallSession stays NestJS)
loadmodule "dialog.so"

#!ifdef WITH_NAT
loadmodule "nathelper.so"
#!endif

#!ifdef WITH_ANTIFLOOD
loadmodule "pike.so"
#!endif

# Outbound / Path placeholders for WSS contacts (ADR-039)
loadmodule "path.so"

#!ifdef WITH_RTPENGINE
loadmodule "rtpengine.so"
#!endif

# RC1 — UAC digest auth: answers carrier-side 407/401 challenges (Telnyx
# Credentials-auth SIP Connection). See failure_route[MANAGE_FAILURE].
loadmodule "uac.so"

# ###############################
# ### Module parameters       ###
# ###############################

modparam("jsonrpcs", "pretty_format", 1)

modparam("tm", "failure_reply_mode", 0)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("tm", "auto_inv_100", 1)
modparam("tm", "auto_inv_100_reason", "VSP trying")

# contacts_avp belongs on tm (not tmx) in Kamailio 5.8.x; unused unless t_load_contacts() is called.
# contact_flows_avp is mandatory whenever contacts_avp is set (tm module init, Kamailio 5.8.7).
modparam("tm", "contacts_avp", "tmx_contacts")
modparam("tm", "contact_flows_avp", "$avp(tmx_contact_flows)")

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

modparam("ctl", "binrpc", "unix:/tmp/kamailio_ctl")

modparam("htable", "htable", "ipban=>size=8;autoexpire=300;")
modparam("htable", "htable", "authfail=>size=8;autoexpire=600;")
# Phase 9: runtime media correlation by SIP Call-ID (platformUuid in value)
modparam("htable", "htable", "rtpe_puuid=>size=12;autoexpire=7200;")
modparam("htable", "htable", "rtpe_carrier=>size=12;autoexpire=7200;")
modparam("htable", "htable", "rtpe_active=>size=12;autoexpire=7200;")
# RC1 multi-tenant fix: tenantId resolved by digest auth at REGISTER, keyed by
# AoR, so route[INVITE] can forward it as dto.tenantId. Without this, INVITE-time
# routing lookups are unscoped by tenant and ambiguous once two tenants share the
# same shared SIP_REGISTRAR_HOST with overlapping extension numbers (e.g. "100").
modparam("htable", "htable", "tenant_by_aor=>size=10;autoexpire=7200;")
modparam("htable", "htable", "tenant_by_user=>size=10;autoexpire=7200;")

#!ifdef WITH_TLS
modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("tls", "tls_method", "TLSv1.2+")
modparam("tls", "verify_certificate", 0)
modparam("tls", "require_certificate", 0)
#!endif

#!ifdef WITH_WEBSOCKET
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 30)
modparam("websocket", "keepalive_processes", 1)
modparam("websocket", "verbose_list", 0)
#!endif

# --- Registrar / usrloc (memory default; postgres when KAMAILIO_USRLOC_PERSISTENCE=postgres) ---
# __USRLOC_DB_MODE__ replaced by docker-entrypoint (0=memory, 2=postgres)
modparam("usrloc", "db_mode", __USRLOC_DB_MODE__)
__USRLOC_DB_URL_LINE__
modparam("usrloc", "timer_interval", 60)
modparam("usrloc", "timer_procs", 1)
modparam("usrloc", "use_domain", 1)
modparam("usrloc", "desc_time_order", 1)
modparam("usrloc", "nat_bflag", FLB_NATB)

modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_contacts", 10)
modparam("registrar", "retry_after", 30)
modparam("registrar", "default_expires", 600)
modparam("registrar", "min_expires", 60)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "use_path", 1)
modparam("registrar", "path_mode", 0)
modparam("registrar", "received_avp", "$avp(nh_received)")

#!ifdef WITH_AUTH_FRAMEWORK
modparam("auth", "nonce_count", 1)
modparam("auth", "nonce_expire", 300)
#!endif

#!ifdef WITH_NESTJS_AUTH
# content_type on connection — used by http_connect/_raw; auth still via hdrs on request helpers
modparam("http_client", "httpcon", "nestjs=>http://api:3000;timeout=2")
modparam("http_client", "maxdatasize", 2048)
modparam("http_client", "query_result", 0)
modparam("http_client", "query_maxdatasize", 2048)
#!endif

# --- Permissions ---
modparam("permissions", "db_mode", 0)
modparam("permissions", "address_file", "/etc/kamailio/permissions.address")

#!ifdef WITH_DISPATCHER
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "xavp_dst", "_dsdst_")
modparam("dispatcher", "xavp_ctx", "_dsctx_")
modparam("dispatcher", "force_dst", 1)
#!endif

# RC1 — Telnyx Credentials-auth SIP Connection: realm observed on the wire in
# Proxy-Authenticate is "sip.vspphone.com" (Telnyx echoes our own domain for
# this Connection). Format is username:realm:password (NOT user:pass@realm).
# Injected at container start — see docker-entrypoint.sh.
modparam("uac", "credential", "__TELNYX_SIP_USERNAME__:sip.vspphone.com:__TELNYX_SIP_PASSWORD__")

modparam("dialog", "dlg_flag", 4)
modparam("dialog", "default_timeout", 21600)
modparam("dialog", "db_mode", 0)
# RC1 fix: uac_auth() does NOT increment CSeq on the authenticated retry it
# builds. Without dialog-tracked CSeq updates, our retry to Telnyx reuses the
# same Call-ID/From-tag/CSeq as the original unauthenticated INVITE (only the
# Via branch differs), which trips RFC3261 8.2.2.2 "merged request" detection
# on Telnyx's side -> 482 Request Merged instead of being evaluated as auth.
# dlg_flag alone is a no-op in 5.8.x (deprecated) — dlg_manage() is required
# (called in the BRIDGE_CARRIER branch of route[INVITE]).
modparam("dialog", "track_cseq_updates", 1)

#!ifdef WITH_NAT
modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_from", "sip:keepalive@sip.localhost")
modparam("nathelper", "received_avp", "$avp(nh_received)")
#!endif

modparam("path", "use_received", 1)

#!ifdef WITH_ANTIFLOOD
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 16)
modparam("pike", "remove_latency", 4)
#!endif

#!ifdef WITH_RTPENGINE
# Phase 9 — NG control plane (TEL-RTP-001)
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:2223")
modparam("rtpengine", "rtpengine_disable_tout", 20)
modparam("rtpengine", "extra_id_pv", "$avp(rtpe_label)")
#!endif

# ###############################
# ### Routing logic           ###
# ###############################

request_route {
    # --- Flood guard ---
#!ifdef WITH_ANTIFLOOD
    if (!pike_check_req()) {
        xlog("L_WARN", "PIKE block $si:$sp method=$rm\n");
        $sht(ipban=>$si) = 1;
        exit;
    }
    if ($sht(ipban=>$si) != $null) {
        xlog("L_WARN", "Banned IP $si — drop\n");
        exit;
    }
#!endif

    # --- Max-Forwards ---
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # --- Sanity ---
    if(!sanity_check("17895", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }

    # --- Cancel / ACK in-dialog handling ---
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
#!ifdef WITH_RTPENGINE
            $var(puuid) = $sht(rtpe_puuid=>$ci);
            if ($sht(rtpe_active=>$ci) == "1") {
                route(RTPENGINE_DELETE);
            }
#!endif
            route(RELAY);
        }
        exit;
    }

    if (!is_method("ACK")) {
        if(t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # --- OPTIONS health (SIP) ---
    if (is_method("OPTIONS")) {
        xlog("L_INFO", "OPTIONS health from $si:$sp proto=$proto r-uri=$ru\n");
        options_reply();
        exit;
    }

    # --- NAT detection (foundation) ---
#!ifdef WITH_NAT
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
            setbflag(FLB_NATB);
        } else {
            if (is_first_hop()) {
                setflag(5); /* NAT flag for later phases */
            }
        }
        force_rport();
    }
#!endif

    # --- REGISTER: Phase 6 NestJS digest + usrloc ---
    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    # --- In-dialog INFO → NestJS routing/continue (Remediation H-02) ---
    if (has_totag() && is_method("INFO")) {
        route(ROUTING_CONTINUE);
        exit;
    }

    # --- In-dialog requests ---
    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) {
                setflag(4); /* dialog flag if created later */
#!ifdef WITH_RTPENGINE
                $var(puuid) = $sht(rtpe_puuid=>$ci);
                if ($var(puuid) == $null || $var(puuid) == "") {
                    $var(puuid) = $hdr(X-VSP-Platform-UUID);
                }
                if ($sht(rtpe_active=>$ci) == "1") {
                    route(RTPENGINE_DELETE);
                }
#!endif
            }
            route(RELAY);
            exit;
        } else {
            if (is_method("ACK")) {
                if (t_check_trans()) {
                    route(RELAY);
                    exit;
                } else {
                    exit;
                }
            }
            sl_send_reply("404", "Not here");
            exit;
        }
    }

    # --- Initial INVITE: Phase 7/8 route plan + Phase 9 media anchor ---
    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    # --- RC3: SIP REFER (blind transfer) ---
    if (is_method("REFER")) {
        route(REFER);
        exit;
    }

    # --- Other methods still stubbed ---
    xlog("L_INFO", "Unsupported method=$rm r-uri=$ru from=$si proto=$proto\n");
    sl_send_reply("503", "Service Unavailable - method not enabled");
    exit;
}

# ----- Relay -----
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# RFC 3261 §21.1 — after t_newtran() on a desk-originated INVITE, responses MUST use
# t_reply() on the open UAS transaction. sl_send_reply() creates a stateless reply
# that strict UAs (Grandstream GRP2601) treat as "No Response".
route[DESK_REPLY] {
    if ($avp(desk_uas) == 1) {
        t_reply("$var(desk_code)", "$var(desk_reason)");
    } else {
        sl_send_reply("$var(desk_code)", "$var(desk_reason)");
    }
    exit;
}

# ----- RC3: blind SIP REFER transfer -----
route[REFER] {
    if (!t_check_trans()) {
        sl_send_reply("481", "Call/Transaction Does Not Exist");
        exit;
    }
    if ($hdr(Refer-To) == $null || $hdr(Refer-To) == "") {
        sl_send_reply("400", "Missing Refer-To");
        exit;
    }
    xlog("L_INFO", "REFER from=$fu refer-to=$hdr(Refer-To) callid=$ci\n");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# ----- Remediation C-01: NestJS HTTP POST via http_client (not http_async_client $http_req) -----
# Input: $var(nestjs_path), $var(nestjs_body); optional $var(nestjs_extra_hdrs)
# Output: $var(http_code), $var(http_res)
route[NESTJS_HTTP_POST] {
    $var(nestjs_hdrs) = "Content-Type: application/json\r\n";
    if ("__VSP_SERVICE_AUTH_TOKEN__" != "") {
        $var(nestjs_hdrs) = $var(nestjs_hdrs) + VSP_SERVICE_AUTH_HEADER;
    }
    if ($var(nestjs_extra_hdrs) != $null && $var(nestjs_extra_hdrs) != "") {
        $var(nestjs_hdrs) = $var(nestjs_hdrs) + $var(nestjs_extra_hdrs);
    }
    $var(nestjs_url) = NESTJS_BASE_URL + $var(nestjs_path);
#!ifdef RC1_SIP_DIGEST_TRACE
    if ($var(nestjs_path) =~ "auth/sip-digest") {
        xlog("L_INFO", "RC1 sip-digest request url=$var(nestjs_url) callid=$ci hdrs=Content-Type;X-VSP-Service-Auth;X-Request-Id;X-SIP-Call-ID body=$var(nestjs_body)\n");
    }
#!endif
    # http_client_query: Nest sees {} (422). http_client_request: not in this build (cfg fail).
    # http_connect_raw: explicit content_type=application/json (curl-proven path).
    # Auth headers are not supported on http_connect_raw — token must be in JSON (serviceAuth).
    if ($var(nestjs_path) =~ "auth/sip-digest|telecom/register|telecom/unregister|routing/resolve") {
        $var(http_code) = http_connect_raw("nestjs", $var(nestjs_path), "application/json", $var(nestjs_body), "$var(http_res)");
    } else {
        $var(http_code) = http_client_query($var(nestjs_url), $var(nestjs_body), $var(nestjs_hdrs), "$var(http_res)");
    }
#!ifdef RC1_SIP_DIGEST_TRACE
    if ($var(nestjs_path) =~ "auth/sip-digest|telecom/register|telecom/unregister|routing/resolve") {
        xlog("L_INFO", "RC1 nestjs http path=$var(nestjs_path) callid=$ci http=$var(http_code) body=$var(http_res)\n");
    }
#!endif
}

# ----- Remediation H-01/H-02: relay to APP_MEDIA / VOICEMAIL target -----
route[APP_MEDIA_RELAY] {
    if ($var(app_target) == $null || $var(app_target) == "") {
        xlog("L_ERR", "APP_MEDIA missing target callid=$ci\n");
        sl_send_reply("503", "Media target unavailable");
        exit;
    }
    $var(sip_uri) = $(var(app_target){s.select,0,?});
    if ($var(sip_uri) == $null || $var(sip_uri) == "") {
        $var(sip_uri) = $var(app_target);
    }
    $ru = $var(sip_uri);
    xlog("L_INFO", "APP_MEDIA relay ru=$ru platformUuid=$var(puuid) callid=$ci\n");
    $var(start_body) = "{\"platformUuid\":\"" + $var(puuid) + "\"}";
    $var(nestjs_path) = "/api/v1/telecom/call/start";
    $var(nestjs_body) = $var(start_body);
    $var(nestjs_extra_hdrs) = "X-VSP-Platform-UUID: " + $var(puuid) + "\r\n";
    route(NESTJS_HTTP_POST);
#!ifdef WITH_RTPENGINE
    route(RTPENGINE_OFFER);
#!endif
    t_on_reply("MANAGE_REPLY");
    t_on_failure("MANAGE_FAILURE");
    route(RELAY);
    exit;
}

# ----- Remediation H-02: mid-call application progression -----
route[ROUTING_CONTINUE] {
#!ifdef WITH_NESTJS_AUTH
    $var(puuid) = $hdr(X-VSP-Platform-UUID);
    if ($var(puuid) == $null || $var(puuid) == "") {
        $var(puuid) = $sht(rtpe_puuid=>$ci);
    }
    if ($var(puuid) == $null || $var(puuid) == "") {
        sl_send_reply("400", "Missing platform UUID");
        exit;
    }
    $var(reason) = "ivr_digit";
    if ($hdr(Reason) != $null && $hdr(Reason) != "") {
        $var(reason) = $hdr(Reason);
    }
    $var(digit) = "";
    if ($hdr(DTMF-Digit) != $null) {
        $var(digit) = $hdr(DTMF-Digit);
    }
    $var(cont_body) = "{" +
        "\"platformUuid\":\"" + $var(puuid) + "\"," +
        "\"reason\":\"" + $var(reason) + "\"";
    if ($var(digit) != "") {
        $var(cont_body) = $var(cont_body) + ",\"digit\":\"" + $var(digit) + "\"";
    }
    $var(cont_body) = $var(cont_body) + "}";
    $var(nestjs_path) = "/api/v1/telecom/routing/continue";
    $var(nestjs_body) = $var(cont_body);
    $var(nestjs_extra_hdrs) = "X-Request-Id: kam-cont-" + $ci + "\r\nX-VSP-Platform-UUID: " + $var(puuid) + "\r\n";
    route(NESTJS_HTTP_POST);
    if ($var(http_code) < 200 || $var(http_code) >= 300) {
        sl_send_reply("503", "Continue service unavailable");
        exit;
    }
    if ($var(http_code) != 200) {
        sl_send_reply("503", "Continue failed");
        exit;
    }
    if ($var(http_res) =~ "\"type\"[[:space:]]*:[[:space:]]*\"REJECT\"") {
        sl_send_reply("486", "Busy Here");
        exit;
    }
    if ($var(http_res) =~ "\"type\"[[:space:]]*:[[:space:]]*\"APP_MEDIA\"") {
        if ($var(http_res) =~ "\"target\"[[:space:]]*:[[:space:]]*\"([^\"]+)\"") {
            $var(app_target) = $re;
        }
        route(APP_MEDIA_RELAY);
        exit;
    }
    if ($var(http_res) =~ "\"type\"[[:space:]]*:[[:space:]]*\"BRIDGE_CARRIER\"") {
        jansson_get("destinationE164", "$var(http_res)", "$var(dest_e164)");
        if ($var(dest_e164) != $null && $var(dest_e164) != "") {
            $ru = "sip:" + $var(dest_e164) + "@sip.telnyx.com";
        }
#!ifdef WITH_RTPENGINE
        route(RTPENGINE_OFFER);
#!endif
        route(RELAY);
        exit;
    }
    jansson_get("forkContactsCsv", "$var(http_res)", "$var(forks)");
    if ($var(forks) != $null && $var(forks) != "" && $var(forks) != "null") {
        $ru = $(var(forks){s.select,0,,});
#!ifdef WITH_RTPENGINE
        route(RTPENGINE_OFFER);
#!endif
        route(RELAY);
        exit;
    }
    sl_send_reply("200", "OK");
    exit;
#!else
    sl_send_reply("503", "Continue integration disabled");
    exit;
#!endif
}

# ----- REGISTER (Phase 6) — NestJS digest; INVITE remains stubbed -----
#   POST /api/v1/telecom/auth/sip-digest
#   POST /api/v1/telecom/register | /unregister
route[REGISTRAR] {
    xlog("L_INFO", "REGISTER aor=$tu contact=$ct expires=$hdr(Expires) proto=$proto src=$si\n");

#!ifdef WITH_WEBSOCKET
    # Phase 10 — ADR-039: Path for WSS; strip business headers from browser plane
    if ($proto == "ws" || $proto == "wss") {
        remove_hf("X-VSP-Platform-UUID");
        remove_hf("X-VSP-Tenant-Id");
    }
#!endif

#!ifdef WITH_NESTJS_AUTH
    if (!is_present_hf("Authorization")) {
        auth_challenge("$td", "0");
        exit;
    }

    # Digest: $au/$ar + $sel(authorization["realm"].*) — =~ fails on base64 nonce (+/=)
    $var(auth_user) = $au;
    $var(auth_realm) = $ar;
    $var(auth_hdr) = $hdr(Authorization);
    if ($var(auth_user) == $null || $var(auth_user) == "") {
        $var(auth_user) = $sel(authorization["sip.vspphone.com"].username);
    }
    if ($var(auth_realm) == $null || $var(auth_realm) == "" || $var(auth_realm) == "0") {
        $var(auth_realm) = $sel(authorization["sip.vspphone.com"].realm);
    }
    if ($var(auth_realm) == $null || $var(auth_realm) == "" || $var(auth_realm) == "0") {
        $var(auth_realm) = $td;
    }
    $var(auth_nonce) = $sel(authorization["sip.vspphone.com"].nonce);
    $var(auth_resp) = $sel(authorization["sip.vspphone.com"].response);
    $var(auth_uri) = $sel(authorization["sip.vspphone.com"].uri);
    if ($var(auth_uri) == $null || $var(auth_uri) == "" || $var(auth_uri) == "0") {
        $var(auth_uri) = $ru;
    }
#!ifdef RC1_SIP_DIGEST_TRACE
    xlog("L_INFO", "RC1 digest parsed user=$var(auth_user) realm=$var(auth_realm) nonce=$var(auth_nonce) resp_len=$(var(auth_resp){s.len}) callid=$ci\n");
#!endif

    # Incomplete digest (no response yet) — challenge; do not POST empty/garbage JSON to NestJS
    if ($var(auth_resp) == $null || $var(auth_resp) == "" || $var(auth_resp) == "0") {
        xlog("L_INFO", "REGISTER digest incomplete user=$var(auth_user) auth_hdr_len=$(var(auth_hdr){s.len}) hdr=$var(auth_hdr) callid=$ci\n");
        auth_challenge("$td", "0");
        exit;
    }
    if ($var(auth_nonce) == $null || $var(auth_nonce) == "" || $var(auth_nonce) == "0") {
        xlog("L_INFO", "REGISTER digest missing nonce user=$var(auth_user) — challenging callid=$ci\n");
        auth_challenge("$td", "0");
        exit;
    }

    # RC1: jansson_set requires a valid JSON doc — "" fails with '[' or '{' expected; $null also yields empty POST
    $var(body) = "{}";
    jansson_set("string", "aor", "$tu", "$var(body)");
    jansson_set("string", "username", "$var(auth_user)", "$var(body)");
    jansson_set("string", "realm", "$var(auth_realm)", "$var(body)");
    jansson_set("string", "nonce", "$var(auth_nonce)", "$var(body)");
    jansson_set("string", "response", "$var(auth_resp)", "$var(body)");
    jansson_set("string", "method", "REGISTER", "$var(body)");
    jansson_set("string", "uri", "$var(auth_uri)", "$var(body)");
    jansson_set("string", "srcIp", "$si", "$var(body)");
    # http_connect_raw cannot set X-VSP-Service-Auth — token injected by entrypoint sed
    jansson_set("string", "serviceAuth", "__VSP_SERVICE_AUTH_TOKEN__", "$var(body)");

    if ($(var(body){s.len}) < 20) {
        xlog("L_ERR", "REGISTER sip-digest JSON empty len=$(var(body){s.len}) callid=$ci\n");
        sl_send_reply("503", "Auth service unavailable");
        exit;
    }

    $var(nestjs_path) = "/api/v1/telecom/auth/sip-digest";
    $var(nestjs_body) = $var(body);
    $var(nestjs_extra_hdrs) = "X-Request-Id: kam-" + $ci + "\r\nX-SIP-Call-ID: " + $ci + "\r\n";
    route(NESTJS_HTTP_POST);

    if ($var(http_code) < 200 || $var(http_code) >= 300) {
        xlog("L_ERR", "REGISTER NestJS auth unreachable — fail closed http=$var(http_code)\n");
        sl_send_reply("503", "Auth service unavailable");
        exit;
    }

    # Do not jansson_get boolean into $var + compare — Kamailio coerces "true" via rval_get_long and fails the if
    if (!($var(http_res) =~ "\"allow\"[[:space:]]*:[[:space:]]*true")) {
        xlog("L_WARN", "REGISTER denied by NestJS user=$var(auth_user) res=$var(http_res)\n");
        auth_challenge("$td", "0");
        exit;
    }

    jansson_get("deviceId", "$var(http_res)", "$var(device_id)");
    jansson_get("tenantId", "$var(http_res)", "$var(tenant_id)");
    # RC1 multi-tenant fix: cache tenantId by AoR so a later INVITE from this same
    # AoR (desk-originated OUTBOUND/INTERNAL) can forward it to routing/resolve.
    if ($var(tenant_id) != $null && $var(tenant_id) != "" && $var(tenant_id) != "0") {
        $sht(tenant_by_aor=>$tu) = $var(tenant_id);
        $var(reg_aor_user) = "sip:" + $var(auth_user) + "@" + $td;
        if ($var(reg_aor_user) != $tu) {
            $sht(tenant_by_aor=>$var(reg_aor_user)) = $var(tenant_id);
        }
        $sht(tenant_by_user=>$var(auth_user)) = $var(tenant_id);
    }
    xlog("L_INFO", "RC1_REG_IDENTITY aor=$tu auth_user=$var(auth_user) tenant=$var(tenant_id) contact=$ct src=$si:$sp ua=$ua callid=$ci\n");
    xlog("L_INFO", "RC1_REG_COMPARE r-uri=$ru from=$fu to=$tu contact=$ct auth_user=$var(auth_user) expires=$var(exp_val) via=$hdr(Via) path=$hdr(Path) allow=$hdr(Allow) supported=$hdr(Supported) callid=$ci\n");

#!ifdef WITH_WEBSOCKET
    if ($proto == "ws" || $proto == "wss") {
        if (!add_path()) {
            xlog("L_WARN", "REGISTER add_path failed proto=$proto\n");
        } else {
            xlog("L_INFO", "REGISTER WSS Path inserted proto=$proto\n");
        }
    }
#!endif

    # usrloc update (save sends SIP 200)
    if (!save("location")) {
        xlog("L_ERR", "REGISTER usrloc save failed\n");
        sl_send_reply("500", "Server Internal Error");
        exit;
    }

    $var(exp_val) = $hdr(Expires);
    if ($var(exp_val) == $null || $var(exp_val) == "") {
        $var(exp_val) = "600";
    }

    # jansson — Contact/UA often contain quotes; string-concat JSON breaks Nest validation
    $var(reg_body) = "{}";
    jansson_set("string", "aor", "$tu", "$var(reg_body)");
    jansson_set("string", "contact", "$ct", "$var(reg_body)");
    jansson_set("integer", "expires", "$var(exp_val)", "$var(reg_body)");
    jansson_set("string", "userAgent", "$ua", "$var(reg_body)");
    jansson_set("string", "srcIp", "$si", "$var(reg_body)");
    if ($var(device_id) != $null && $var(device_id) != "" && $var(device_id) != "0") {
        jansson_set("string", "deviceId", "$var(device_id)", "$var(reg_body)");
    }
    if ($var(tenant_id) != $null && $var(tenant_id) != "" && $var(tenant_id) != "0") {
        jansson_set("string", "tenantId", "$var(tenant_id)", "$var(reg_body)");
    }
    jansson_set("string", "serviceAuth", "__VSP_SERVICE_AUTH_TOKEN__", "$var(reg_body)");

    if ($var(exp_val) == "0") {
        $var(nestjs_path) = "/api/v1/telecom/unregister";
    } else {
        $var(nestjs_path) = "/api/v1/telecom/register";
    }
    $var(nestjs_body) = $var(reg_body);
    $var(nestjs_extra_hdrs) = "";
    route(NESTJS_HTTP_POST);
    xlog("L_INFO", "REGISTER ok device=$var(device_id) tenant=$var(tenant_id) notify=$var(http_code) res=$var(http_res)\n");
    exit;
#!else
    sl_send_reply("503", "Auth integration disabled");
    exit;
#!endif
}

route[REGISTRAR_STUB] {
    route(REGISTRAR);
}

# ----- INVITE (Phase 7/8) — NestJS routing/resolve → FORK or BRIDGE_CARRIER -----
#   POST /api/v1/telecom/routing/resolve
route[INVITE] {
    xlog("L_INFO", "INVITE r-uri=$ru from=$fu to=$tu callid=$ci src=$si:$sp ua=$ua\n");

#!ifdef WITH_NESTJS_AUTH
    # Telnyx inbound: IP ACL group 2 (carrier signaling)
    $var(from_carrier) = 0;
    if (allow_source_address("2")) {
        $var(from_carrier) = 1;
        xlog("L_INFO", "INVITE from Telnyx ACL src=$si\n");
    }

    # Desk/UAC INVITE: open transaction and send 100 Trying before NestJS (RFC 3261 §21.1.1).
    if ($var(from_carrier) == 0) {
        if (!t_newtran()) {
            sl_reply_error();
            exit;
        }
        $avp(desk_uas) = 1;
        t_reply("100", "Trying");
    }

    $var(intent) = "INTERNAL";
    $var(dnis_json) = "";
    $var(cli_json) = "";
    if ($var(from_carrier) == 1) {
        $var(intent) = "INBOUND";
        $var(dnis_user) = $rU;
        $var(dnis_json) = ",\"dnis\":\"" + $var(dnis_user) + "\"";
        $var(cli_json) = ",\"cli\":\"" + $fU + "\"";
    } else if ($rU =~ "^\+?[0-9]{8,15}$") {
        $var(intent) = "OUTBOUND";
        $var(cli_json) = ",\"cli\":\"" + $fU + "\"";
    }

    $var(caller_aor) = $fu;
    $var(cached_tenant_id) = "";
    # Resolve canonical registrar AoR when desk phone sends Contact-style From (private IP).
    if ($fU != $null && $fU != "") {
        $var(reg_aor_guess) = "sip:" + $fU + "@" + $td;
        if ($sht(tenant_by_aor=>$var(reg_aor_guess)) != $null && $sht(tenant_by_aor=>$var(reg_aor_guess)) != "") {
            $var(cached_tenant_id) = $sht(tenant_by_aor=>$var(reg_aor_guess));
            $var(caller_aor) = $var(reg_aor_guess);
        } else if ($sht(tenant_by_user=>$fU) != $null && $sht(tenant_by_user=>$fU) != "") {
            $var(cached_tenant_id) = $sht(tenant_by_user=>$fU);
        }
    }
    # RC1 desk trace: From/Auth user 100 (ignore scanners like +1000)
    if ($fU == "100" || $au == "100") {
        xlog("L_INFO", "RC1_DESK_INVITE callid=$ci from=$fu from_user=$fU auth_user=$au r-uri=$ru to=$tu src=$si proto=$proto intent_pre=$var(intent)\n");
    }
    # RC1 multi-tenant fix: forward the tenantId cached at REGISTER for this AoR so
    # RoutingService can scope its DB lookups (avoids collisions across tenants that
    # share the same SIP_REGISTRAR_HOST with overlapping extension numbers). Only
    # populated for desk-originated calls whose From == a previously registered AoR;
    # carrier-inbound legs legitimately miss this (tenant resolved via DNIS instead).
    if ($var(cached_tenant_id) == $null || $var(cached_tenant_id) == "") {
        $var(cached_tenant_id) = $sht(tenant_by_aor=>$var(caller_aor));
    }
    $var(body) = "{}";
    jansson_set("string", "callerAor", "$var(caller_aor)", "$var(body)");
    jansson_set("string", "requestUri", "$ru", "$var(body)");
    jansson_set("string", "callId", "$ci", "$var(body)");
    jansson_set("string", "to", "$tu", "$var(body)");
    jansson_set("string", "from", "$fu", "$var(body)");
    jansson_set("string", "intentHint", "$var(intent)", "$var(body)");
    if ($var(cached_tenant_id) != $null && $var(cached_tenant_id) != "") {
        jansson_set("string", "tenantId", "$var(cached_tenant_id)", "$var(body)");
    }
    # Prefer digest username when present; else From user (desk = 100)
    if ($au != $null && $au != "" && $au != "0") {
        jansson_set("string", "authUsername", "$au", "$var(body)");
    } else {
        jansson_set("string", "authUsername", "$fU", "$var(body)");
    }
    if ($var(from_carrier) == 1) {
        jansson_set("string", "dnis", "$rU", "$var(body)");
        jansson_set("string", "cli", "$fU", "$var(body)");
    }
    # RC1 fix: do NOT send "cli" for desk-originated OUTBOUND — $fU is the
    # caller's raw extension (e.g. "100"), not a valid E.164 CLI, and was
    # unconditionally overriding the line's real configured Caller ID on
    # the API side. RoutingService now derives outbound CLI from
    # callerCtx.callerIdNumber (the provisioned Line/CallerID -> DID).
    jansson_set("string", "serviceAuth", "__VSP_SERVICE_AUTH_TOKEN__", "$var(body)");
    jansson_set("string", "srcIp", "$si", "$var(body)");
    jansson_set("string", "sourcePort", "$sp", "$var(body)");
    jansson_set("string", "userAgent", "$ua", "$var(body)");

    if ($fU == "100" || $au == "100") {
        xlog("L_INFO", "RC1_DESK_INVITE nest_body_len=$(var(body){s.len}) intent=$var(intent) callid=$ci\n");
    }
    xlog("L_INFO", "RC1_INVITE_IDENTITY callid=$ci caller_aor=$var(caller_aor) auth_user=$au from_user=$fU tenant=$var(cached_tenant_id) intent=$var(intent) src=$si:$sp ua=$ua\n");
    xlog("L_INFO", "RC1_INVITE_COMPARE callid=$ci r-uri=$ru from=$fu to=$tu contact=$ct auth_user=$au ppi=$hdr(P-Preferred-Identity) pai=$hdr(P-Asserted-Identity) rpid=$hdr(Remote-Party-ID) via=$hdr(Via) route=$hdr(Route) rr=$hdr(Record-Route) sdp_len=$(rb{s.len})\n");

    $var(nestjs_path) = "/api/v1/telecom/routing/resolve";
    $var(nestjs_body) = $var(body);
    $var(nestjs_extra_hdrs) = "X-Request-Id: kam-inv-" + $ci + "\r\nIdempotency-Key: " + $ci + "\r\n";
    route(NESTJS_HTTP_POST);

    if ($var(http_code) < 200 || $var(http_code) >= 300) {
        xlog("L_ERR", "INVITE NestJS route unreachable — fail closed\n");
        $var(desk_code) = "503";
        $var(desk_reason) = "Routing service unavailable";
        route(DESK_REPLY);
    }

    if ($var(http_code) != 200) {
        xlog("L_WARN", "INVITE route HTTP=$var(http_code)\n");
        $var(desk_code) = "503";
        $var(desk_reason) = "Routing failed";
        route(DESK_REPLY);
    }

    jansson_get("platformUuid", "$var(http_res)", "$var(puuid)");
    if ($var(puuid) != $null && $var(puuid) != "") {
        remove_hf("X-VSP-Platform-UUID");
        append_hf("X-VSP-Platform-UUID: $var(puuid)\r\n");
        xlog("L_INFO", "INVITE platformUuid=$var(puuid)\n");
        $sht(rtpe_puuid=>$ci) = $var(puuid);
        if ($var(from_carrier) == 1) {
            $sht(rtpe_carrier=>$ci) = "1";
        } else {
            $sht(rtpe_carrier=>$ci) = "0";
        }
    }

    # REJECT action?
    if ($var(http_res) =~ "\"type\"[[:space:]]*:[[:space:]]*\"REJECT\"") {
        $var(rcode) = 480;
        if ($var(http_res) =~ "486") { $var(rcode) = 486; }
        else if ($var(http_res) =~ "403") { $var(rcode) = 403; }
        else if ($var(http_res) =~ "404") { $var(rcode) = 404; }
        else if ($var(http_res) =~ "503") { $var(rcode) = 503; }
        xlog("L_INFO", "INVITE rejected by NestJS code=$var(rcode)\n");
        $var(desk_code) = "$var(rcode)";
        $var(desk_reason) = "Call rejected";
        route(DESK_REPLY);
    }

    # Outbound PSTN: BRIDGE_CARRIER → dispatcher set 2 (Telnyx)
    if ($var(http_res) =~ "\"type\"[[:space:]]*:[[:space:]]*\"BRIDGE_CARRIER\"") {
        jansson_get("destinationE164", "$var(http_res)", "$var(dest_e164)");
        jansson_get("carrierSipHost", "$var(http_res)", "$var(c_host)");
        jansson_get("dispatcherSet", "$var(http_res)", "$var(dset)");
        if ($var(dset) == $null || $var(dset) == "") { $var(dset) = "2"; }
        if ($var(c_host) == $null || $var(c_host) == "") { $var(c_host) = "sip.telnyx.com"; }
        if ($var(dest_e164) != $null && $var(dest_e164) != "") {
            $ru = "sip:" + $var(dest_e164) + "@" + $var(c_host);
        }
        if (!ds_select_dst("$var(dset)", "4")) {
            xlog("L_ERR", "INVITE Telnyx dispatcher set $var(dset) miss — failover hook\n");
            # Retry hook: next destination in set
            if (!ds_next_dst()) {
                $var(desk_code) = "503";
                $var(desk_reason) = "Carrier unavailable";
                route(DESK_REPLY);
            }
        }
        xlog("L_INFO", "INVITE BRIDGE_CARRIER ru=$ru dset=$var(dset)\n");
        xlog("L_INFO", "RC1_ROUTE_DECISION action=BRIDGE_CARRIER callid=$ci ru=$ru dset=$var(dset) tenant=$var(cached_tenant_id) caller_aor=$var(caller_aor)\n");
        # RC1 fix: rewrite From/PAI to the provisioned E.164 Caller ID before
        # bridging to Telnyx. Desk UAs send From=<sip:100@...>; Telnyx CDRs
        # recorded cli=+10 for those INVITEs (sip-trunking detail_records for
        # Call-IDs 8dcIT9VcRB03GlQoI7ZPmw.. / 4mnGNgDQn6Ocdmg73qVsqw..), so the
        # PSTN leg never presented a valid ANI and the callee never rang —
        # while Zoiper still heard ringback (Telnyx instant_ringback / 180).
        # RoutingService already returns callerIdNumber; apply it on the wire.
        jansson_get("callerIdNumber", "$var(http_res)", "$var(cli_e164)");
        jansson_get("callerIdName", "$var(http_res)", "$var(cli_name)");
        if ($var(cli_e164) != $null && $var(cli_e164) != "") {
            if ($var(cli_name) != $null && $var(cli_name) != "" && $var(cli_name) != "null") {
                uac_replace_from("$var(cli_name)", "sip:$var(cli_e164)@$fd");
            } else {
                uac_replace_from("", "sip:$var(cli_e164)@$fd");
            }
            remove_hf("P-Asserted-Identity");
            if ($var(cli_name) != $null && $var(cli_name) != "" && $var(cli_name) != "null") {
                append_hf("P-Asserted-Identity: \"$var(cli_name)\" <sip:$var(cli_e164)@$fd>\r\n");
            } else {
                append_hf("P-Asserted-Identity: <sip:$var(cli_e164)@$fd>\r\n");
            }
            remove_hf("Remote-Party-ID");
            if ($var(cli_name) != $null && $var(cli_name) != "" && $var(cli_name) != "null") {
                append_hf("Remote-Party-ID: \"$var(cli_name)\" <sip:$var(cli_e164)@$fd>;party=calling;screen=yes;privacy=off\r\n");
            } else {
                append_hf("Remote-Party-ID: <sip:$var(cli_e164)@$fd>;party=calling;screen=yes;privacy=off\r\n");
            }
            xlog("L_INFO", "INVITE BRIDGE_CARRIER cli=$var(cli_e164) from_rewritten=1 callid=$ci\n");
        } else {
            xlog("L_WARN", "INVITE BRIDGE_CARRIER missing callerIdNumber — leaving From as-is callid=$ci\n");
        }
        # RC1 fix: track this dialog so track_cseq_updates can bump CSeq when
        # uac_auth() retries after Telnyx's 407 (see modparam("dialog",
        # "track_cseq_updates", 1) above). Must run before the transaction
        # is created (i.e. before t_relay() inside route(RELAY) below).
        dlg_manage();
        $var(start_body) = "{\"platformUuid\":\"" + $var(puuid) + "\"}";
        $var(nestjs_path) = "/api/v1/telecom/call/start";
        $var(nestjs_body) = $var(start_body);
        $var(nestjs_extra_hdrs) = "X-VSP-Platform-UUID: " + $var(puuid) + "\r\n";
        route(NESTJS_HTTP_POST);
#!ifdef WITH_RTPENGINE
        route(RTPENGINE_OFFER);
#!endif
        # RC1 — mark this branch so MANAGE_FAILURE knows it may answer a carrier 407/401
        # with uac_auth() (desk/fork branches below never set this flag).
        $avp(carrier_leg) = 1;
        record_route();
        t_on_reply("MANAGE_REPLY");
        t_on_failure("MANAGE_FAILURE");
        route(RELAY);
        exit;
    }

    # APP_MEDIA / VOICEMAIL — enterprise media applications (Remediation H-01)
    if ($var(http_res) =~ "\"type\"[[:space:]]*:[[:space:]]*\"APP_MEDIA\"" ||
        $var(http_res) =~ "\"type\"[[:space:]]*:[[:space:]]*\"VOICEMAIL\"") {
        if ($var(http_res) =~ "\"target\"[[:space:]]*:[[:space:]]*\"([^\"]+)\"") {
            $var(app_target) = $re;
        }
        route(APP_MEDIA_RELAY);
        exit;
    }

    # Multi-device fork from forkContactsCsv (INTERNAL / INBOUND)
    jansson_get("forkContactsCsv", "$var(http_res)", "$var(forks)");
    if ($var(forks) != $null && $var(forks) != "" && $var(forks) != "null") {
        $var(first) = $(var(forks){s.select,0,,});
        if ($var(first) != $null && $var(first) != "") {
            $ru = $var(first);
            xlog("L_INFO", "INVITE primary contact=$ru\n");
        }
        $var(i) = 1;
        while ($var(i) < 10) {
            $var(c) = $(var(forks){s.select,$var(i),,});
            if ($var(c) == $null || $var(c) == "") {
                $var(i) = 10;
            } else {
                append_branch("$var(c)");
                xlog("L_INFO", "INVITE fork branch=$var(c)\n");
                $var(i) = $var(i) + 1;
            }
        }
    } else {
        if (!lookup("location")) {
            xlog("L_WARN", "INVITE no forkContacts and usrloc miss\n");
            $var(desk_code) = "480";
            $var(desk_reason) = "Temporarily Unavailable";
            route(DESK_REPLY);
        }
    }

    $var(start_body) = "{\"platformUuid\":\"" + $var(puuid) + "\"}";
    $var(nestjs_path) = "/api/v1/telecom/call/start";
    $var(nestjs_body) = $var(start_body);
    $var(nestjs_extra_hdrs) = "X-VSP-Platform-UUID: " + $var(puuid) + "\r\n";
    route(NESTJS_HTTP_POST);

#!ifdef WITH_RTPENGINE
    route(RTPENGINE_OFFER);
#!endif
    t_on_reply("MANAGE_REPLY");
    t_on_branch("MANAGE_BRANCH");
    t_on_failure("MANAGE_FAILURE");
    route(RELAY);
    exit;
#!else
    sl_send_reply("503", "Routing integration disabled");
    exit;
#!endif
}

# ----- Phase 9 RTPengine media (TEL-RTP-001) -----
route[RTPENGINE_SET_FLAGS] {
    $var(rtp_flags) = "replace-origin replace-session-connection";
    $var(from_carrier) = $sht(rtpe_carrier=>$ci);
    if ($var(from_carrier) == $null || $var(from_carrier) == "") {
        $var(from_carrier) = 0;
    }
    if ($proto == "ws" || $proto == "wss" || $rb =~ "a=fingerprint") {
        # WebRTC-ready: ICE relay + DTLS pass-through at RTPengine
        $var(rtp_flags) = $var(rtp_flags) + " ICE=force ICE=force-relay DTLS=passive";
        xlog("L_DBG", "rtpengine flags webrtc proto=$proto\n");
    } else if ($var(from_carrier) == 1) {
        # PSTN carrier leg — plain RTP anchor
        $var(rtp_flags) = $var(rtp_flags) + " ICE=remove RTP/AVP";
        xlog("L_DBG", "rtpengine flags pstn-carrier\n");
    } else {
        # Desk/internal SIP — NAT UAs (Zoiper) put private c= in SDP but signal from
        # a public IP. rtpengine 3.8+ defaults to trust-address (trust SDP c=), which
        # breaks NAT; SIP-source-address uses the SIP packet source instead.
        $var(rtp_flags) = $var(rtp_flags) + " ICE=remove SDES=on SIP-source-address";
        xlog("L_DBG", "rtpengine flags internal-sip\n");
    }
}

route[RTPENGINE_OFFER] {
#!ifdef WITH_RTPENGINE
    if (!has_body("application/sdp")) {
        xlog("L_DBG", "rtpengine_offer skip — no SDP callid=$ci\n");
        return;
    }
    if ($var(puuid) == $null || $var(puuid) == "") {
        $var(puuid) = $sht(rtpe_puuid=>$ci);
    }
    route(RTPENGINE_SET_FLAGS);
    if ($var(puuid) != $null && $var(puuid) != "") {
        $avp(rtpe_label) = $var(puuid);
    }
    xlog("L_INFO", "rtpengine_offer platformUuid=$var(puuid) callid=$ci flags=$var(rtp_flags)\n");
    if (!rtpengine_offer("$var(rtp_flags) via-branch=extra")) {
        xlog("L_ERR", "rtpengine_offer failed platformUuid=$var(puuid) callid=$ci\n");
        $var(desk_code) = "503";
        $var(desk_reason) = "Media unavailable";
        route(DESK_REPLY);
    }
    $sht(rtpe_active=>$ci) = "1";
    $var(rtpe_event) = "offer";
    route(RTPENGINE_CORR);
#!endif
}

route[RTPENGINE_ANSWER] {
#!ifdef WITH_RTPENGINE
    if (!has_body("application/sdp")) {
        return;
    }
    if ($var(puuid) == $null || $var(puuid) == "") {
        $var(puuid) = $sht(rtpe_puuid=>$ci);
    }
    if ($sht(rtpe_active=>$ci) != "1") {
        return;
    }
    route(RTPENGINE_SET_FLAGS);
    if ($var(puuid) != $null && $var(puuid) != "") {
        $avp(rtpe_label) = $var(puuid);
    }
    xlog("L_INFO", "rtpengine_answer platformUuid=$var(puuid) callid=$ci code=$rs\n");
    if (!rtpengine_answer("$var(rtp_flags) via-branch=extra")) {
        xlog("L_WARN", "rtpengine_answer failed platformUuid=$var(puuid) callid=$ci\n");
        return;
    }
    $var(rtpe_event) = "answer";
    route(RTPENGINE_CORR);
#!endif
}

route[RTPENGINE_DELETE] {
#!ifdef WITH_RTPENGINE
    if ($var(puuid) == $null || $var(puuid) == "") {
        $var(puuid) = $sht(rtpe_puuid=>$ci);
    }
    if ($sht(rtpe_active=>$ci) != "1") {
        return;
    }
    xlog("L_INFO", "rtpengine_delete platformUuid=$var(puuid) callid=$ci method=$rm\n");
    rtpengine_delete();
    $sht(rtpe_active=>$ci) = $null;
    $var(rtpe_event) = "delete";
    route(RTPENGINE_CORR);
#!endif
}

route[RTPENGINE_CORR] {
#!ifdef WITH_NESTJS_AUTH
    if ($var(puuid) == $null || $var(puuid) == "") {
        return;
    }
    if ($var(rtpe_event) == $null || $var(rtpe_event) == "") {
        return;
    }
    $var(corr_body) = "{" +
        "\"platformUuid\":\"" + $var(puuid) + "\"," +
        "\"event\":\"" + $var(rtpe_event) + "\"," +
        "\"sipCallId\":\"" + $ci + "\"" +
        "}";
    $var(nestjs_path) = "/api/v1/telecom/media/lifecycle";
    $var(nestjs_body) = $var(corr_body);
    $var(nestjs_extra_hdrs) = "X-VSP-Platform-UUID: " + $var(puuid) + "\r\n";
    route(NESTJS_HTTP_POST);
    xlog("L_DBG", "media/lifecycle event=$var(rtpe_event) platformUuid=$var(puuid) http=$var(mcode)\n");
#!endif
}

# ----- Optional helper: reload dispatcher (called via kamcmd later) -----
route[DISPATCHER_RELOAD_HINT] {
    # ds_reload() invoked via RPC in ops scripts, not from SIP path in Phase 3
    xlog("L_DBG", "dispatcher.reload hint\n");
}

# ###############################
# ### Reply route             ###
# ###############################

onreply_route[MANAGE_REPLY] {
#!ifdef WITH_NAT
    if (nat_uac_test("1")) {
        fix_nated_contact();
    }
#!endif
    if (has_body("application/sdp") && (status=~"183" || (status=~"200" && is_method("INVITE")))) {
        $var(puuid) = $sht(rtpe_puuid=>$ci);
        # Carrier-leg replies only — use PSTN RTP flags (not desk NAT flags).
        $sht(rtpe_carrier=>$ci) = "1";
        route(RTPENGINE_ANSWER);
    }
    xlog("L_DBG", "reply $rs $rr to $rm code=$rs platformUuid=$sht(rtpe_puuid=>$ci)\n");
}

onreply_route {
#!ifdef WITH_NAT
    if (nat_uac_test("1")) {
        fix_nated_contact();
    }
#!endif
    xlog("L_DBG", "reply $rs $rr to $rm code=$rs\n");
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
#!ifdef WITH_RTPENGINE
        $var(puuid) = $sht(rtpe_puuid=>$ci);
        route(RTPENGINE_DELETE);
#!endif
        # RC1 fix (482/407-leak prevention, cancel path — packet-evidence confirmed):
        # when the caller CANCELs while our carrier-auth retry (see below) is in flight,
        # the original challenged branch still holds a stale 401/407 final response.
        # Kamailio's default cross-branch response selection (RFC3261 16.7) prefers
        # relaying that stale 401/407 over the canceled branch's proper 487 — leaking
        # Telnyx's Proxy-Authenticate/nonce to the client even after it was already told
        # "200 canceling". Zoiper reacted by mounting its own authenticated re-INVITE
        # reusing the same Call-ID/From-tag, which Telnyx rejected as 482 Request Merged
        # (see rc1-evidence/RC1-carrier-auth-482-investigation.md). Always finish a
        # canceled transaction with one clean, explicit 487 ourselves.
        t_reply("487", "Request Terminated");
        exit;
    }

    # RC1 — Telnyx Credentials-auth SIP Connection challenges every carrier INVITE
    # with 401/407. Answer once with uac_auth() using the configured trunk credential;
    # $avp(carrier_leg) restricts this to the BRIDGE_CARRIER branch only (never desk/fork
    # legs), and $avp(carrier_auth_retry) caps it to a single retry to avoid a 407 loop.
    if ($avp(carrier_leg) == 1) {
        if ((t_check_status("401") || t_check_status("407")) && $avp(carrier_auth_retry) != 1) {
            $avp(carrier_auth_retry) = 1;
            xlog("L_INFO", "carrier auth challenge code=$T_reply_code callid=$ci — retrying with uac_auth\n");
            if (uac_auth()) {
                t_relay();
                exit;
            }
            xlog("L_ERR", "uac_auth failed to build Proxy-Authorization callid=$ci\n");
        }

        # RC1 fix (482 prevention — see rc1-evidence/RC1-carrier-auth-482-investigation.md
        # sections 5/6): once the carrier leg has reached a final failure we are not
        # retrying (either a non-auth error, or our own uac_auth() retry above also
        # failed), do NOT fall through to Kamailio's default relay. TM's forking logic
        # prefers relaying a 401/407 (RFC3261 16.7) even when a later branch got a hard
        # 403 — that leaked Telnyx's Proxy-Authenticate/nonce to Zoiper, which then built
        # its own "authenticated" re-INVITE reusing the same Call-ID/From-tag, which
        # Telnyx rejected as 482 Request Merged. Terminate cleanly with one sanitized
        # final response instead — never relay carrier-only auth headers to the client.
        xlog("L_WARN", "carrier leg failed final code=$T_reply_code callid=$ci — sending clean failure to client\n");
#!ifdef WITH_RTPENGINE
        $var(puuid) = $sht(rtpe_puuid=>$ci);
        route(RTPENGINE_DELETE);
#!endif
        t_reply("502", "Carrier Unavailable");
        exit;
    }

    xlog("L_WARN", "transaction failure method=$rm platformUuid=$sht(rtpe_puuid=>$ci)\n");
#!ifdef WITH_RTPENGINE
    $var(puuid) = $sht(rtpe_puuid=>$ci);
    route(RTPENGINE_DELETE);
#!endif
}

# ###############################
# ### WebSocket / HTTP        ###
# ###############################

event_route[xhttp:request] {
    set_reply_close();
    set_reply_no_connect();

    # HTTP health for Compose / LB (Phase 3 health endpoint)
    if ($hu =~ "^/health" || $hu =~ "^/ready") {
        xlog("L_INFO", "HTTP health $hu from $si\n");
        xhttp_reply("200", "OK", "application/json",
            "{\"status\":\"ok\",\"service\":\"kamailio\",\"phase\":10,\"rtpengine\":\"configured\",\"wss\":\"enabled\"}");
        exit;
    }

#!ifdef WITH_WEBSOCKET
    if ($Rp == 8080 || $Rp == 8443) {
        if ($hdr(Upgrade) =~ "[Ww]eb[Ss]ocket" || $hdr(Upgrade) =~ "websocket") {
            if (ws_handle_handshake()) {
                xlog("L_INFO", "WS handshake OK from $si sport=$sp port=$Rp\n");
                exit;
            }
            xlog("L_WARN", "WS handshake failed from $si\n");
            xhttp_reply("400", "Bad Request", "text/plain", "Websocket handshake failed");
            exit;
        }
    }
#!endif

    xhttp_reply("404", "Not Found", "text/plain", "VSP Kamailio Phase 3");
    exit;
}

#!ifdef WITH_WEBSOCKET
event_route[websocket:closed] {
    xlog("L_INFO", "WS closed $si:$sp\n");
}
#!endif

