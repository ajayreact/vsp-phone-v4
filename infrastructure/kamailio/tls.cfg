#
# VSP Phone v4 — Kamailio TLS profile (Phase 2+3)
# WSS shares this server profile on :8443 (ADR-039).
#

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/privkey.pem
certificate = /etc/kamailio/tls/fullchain.pem
ca_list = /etc/kamailio/tls/ca.crt
cipher_list = HIGH:!ADH:!MD5:!RC4:!aNULL:!eNULL:!NULL:!LOW:!EXP
server_name = sip.localhost

[server:8443]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/privkey.pem
certificate = /etc/kamailio/tls/fullchain.pem
ca_list = /etc/kamailio/tls/ca.crt
server_name = wss.localhost

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
