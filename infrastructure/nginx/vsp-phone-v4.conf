# VSP Phone v4 RC1 — single canonical nginx reverse proxy
# Install: infrastructure/nginx/deploy-nginx.sh (run on EC2 as root)
#
# Upstreams (Docker on host):
#   API   → https://127.0.0.1:3000  (NestJS TLS in-container)
#   Admin → http://127.0.0.1:3001   (Next.js admin UI)

# --- API (NestJS HTTPS backend) — no keepalive (breaks TLS upstream in nginx) ---
# Direct proxy_pass in server block below.

# --- Admin / App (Next.js HTTP backend) ---
upstream vsp_admin_http {
    server 127.0.0.1:3001;
    keepalive 8;
}

# Redirect HTTP → HTTPS (all vhosts)
server {
    listen 80;
    listen [::]:80;
    server_name api.vspphone.com app.vspphone.com admin.vspphone.com tenant.vspphone.com vspphone.com www.vspphone.com;
    return 301 https://$host$request_uri;
}

# api.vspphone.com → NestJS API (TLS backend)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vspphone.com;

    ssl_certificate     /etc/letsencrypt/live/api.vspphone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vspphone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        # Public HTTPS terminates at nginx (Let's Encrypt). API listens plain HTTP :3000.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# app.vspphone.com → Operations Center portal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.vspphone.com;

    ssl_certificate     /etc/letsencrypt/live/app.vspphone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vspphone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://vsp_admin_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# admin.vspphone.com → Platform Admin portal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.vspphone.com;

    ssl_certificate     /etc/letsencrypt/live/admin.vspphone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.vspphone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://vsp_admin_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# tenant.vspphone.com → Tenant portal (same Next.js app, hostname routing)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tenant.vspphone.com;

    ssl_certificate     /etc/letsencrypt/live/tenant.vspphone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenant.vspphone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://vsp_admin_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# apex + www → app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vspphone.com www.vspphone.com;

    ssl_certificate     /etc/letsencrypt/live/vspphone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vspphone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://app.vspphone.com$request_uri;
}
