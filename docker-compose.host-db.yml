# ------------------------------------------------------------------------------
# Host DB overlay — reuse host PostgreSQL; use Compose Redis on the Docker network.
#
# EC2 production (legacy stack): set in .env:
#   DATABASE_HOST=vsp-voip-postgres-1
#   POSTGRES_APP_DB=vsp_voip
# See docs/13-production-validation/10-extension-first-ec2-deploy.md
#
# Linux note: host PostgreSQL bound to 127.0.0.1 is NOT reachable via
# host.docker.internal. Set DATABASE_HOST in .env to the EC2 private IP
# (e.g. 172.31.x.x) or configure PostgreSQL listen_addresses='*'.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.host-db.yml --env-file .env up -d api admin rtpengine kamailio
# ------------------------------------------------------------------------------

services:
  # Safety: if these services start, do not bind host ports (legacy stack owns them).
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vsp}:${POSTGRES_PASSWORD:-vsp}@${DATABASE_HOST:-host.docker.internal}:5432/${POSTGRES_APP_DB:-vsp_phone_v4}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      TLS_API_CERT_FILE: /etc/vsp/tls/api/fullchain.pem
      TLS_API_KEY_FILE: /etc/vsp/tls/api/privkey.pem
      TLS_CA_FILE: /etc/vsp/tls/ca/ca.crt
      KAMAILIO_HTTP_HOST: kamailio
      RTPENGINE_HOST: rtpengine
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"process.env.NODE_TLS_REJECT_UNAUTHORIZED='0'; fetch('https://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]

  admin:
    depends_on:
      api:
        condition: service_started

  kamailio:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      KAMAILIO_USRLOC_PERSISTENCE: postgres
      KAMAILIO_USRLOC_DB_URL: postgres://${POSTGRES_USER:-vsp}:${POSTGRES_PASSWORD:-vsp}@${DATABASE_HOST:-host.docker.internal}:5432/${POSTGRES_KAMAILIO_DB:-kamailio}
