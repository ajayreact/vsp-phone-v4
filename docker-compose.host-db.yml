# ------------------------------------------------------------------------------
# Host DB overlay — reuse host PostgreSQL; use Compose Redis on the Docker network.
#
# EC2 production database (confirmed):
#   DATABASE_HOST=postgres          # vsp-postgres compose service (NOT vsp-voip-postgres-1)
#   POSTGRES_APP_DB=vsp_phone_v4    # 5 tenants live here on vsp-postgres volume
# Legacy vsp_voip on vsp-voip-postgres-1 is v3 schema — do not point v4 API there.
# See docs/13-production-validation/10-extension-first-ec2-deploy.md
#
# Linux note: host PostgreSQL bound to 127.0.0.1 is NOT reachable via
# host.docker.internal. Set DATABASE_HOST in .env to the EC2 private IP
# (e.g. 172.31.x.x) or configure PostgreSQL listen_addresses='*'.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.host-db.yml --env-file .env up -d api admin rtpengine kamailio
# ------------------------------------------------------------------------------

services:
  # Safety: if these services start, do not bind host ports (legacy stack owns them).
  postgres:
    ports: !reset []
    environment:
      # Align with EC2 app DB name (vsp_phone_v4). Override via POSTGRES_DB in .env.
      POSTGRES_DB: ${POSTGRES_DB:-vsp_phone_v4}

  redis:
    ports: !reset []

  api:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtpengine:
        condition: service_healthy
      kamailio:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # Default DATABASE_HOST=postgres (compose service). Override to a private IP only for a true host Postgres.
      # Do NOT use localhost — inside the API container localhost is the API itself.
      DATABASE_URL: postgresql://${POSTGRES_USER:-vsp}:${POSTGRES_PASSWORD:-vsp}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_APP_DB:-vsp_phone_v4}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      # RC1 EC2: nginx terminates Let's Encrypt HTTPS; API listens plain HTTP :3000.
      # Hard-set so host .env cannot force development Nest TLS paths.
      TLS_TERMINATION: nginx
      TLS_ENABLED: 'false'
      TLS_API_CERT_FILE: ${TLS_API_CERT_FILE:-/etc/vsp/tls/api/fullchain.pem}
      TLS_API_KEY_FILE: ${TLS_API_KEY_FILE:-/etc/vsp/tls/api/privkey.pem}
      TLS_CA_FILE: ${TLS_CA_FILE:-/etc/vsp/tls/ca/ca.crt}
      KAMAILIO_HTTP_HOST: kamailio
      KAMAILIO_HTTP_PORT: ${KAMAILIO_HTTP_PORT:-8880}
      RTPENGINE_HOST: rtpengine
      RTPENGINE_NG_PORT: ${RTPENGINE_NG_PORT:-2223}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]

  admin:
    depends_on:
      api:
        condition: service_started

  kamailio:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rtpengine:
        condition: service_started
    environment:
      REDIS_HOST: redis
      KAMAILIO_USRLOC_PERSISTENCE: postgres
      KAMAILIO_USRLOC_DB_URL: postgres://${POSTGRES_USER:-vsp}:${POSTGRES_PASSWORD:-vsp}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_KAMAILIO_DB:-kamailio}
