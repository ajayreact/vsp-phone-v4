# ------------------------------------------------------------------------------
# Host DB overlay — reuse existing PostgreSQL/Redis on the host (e.g. legacy
# vsp-voip-postgres-1 on 127.0.0.1:5432) instead of publishing new DB ports.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.host-db.yml --env-file .env up -d api admin rtpengine kamailio
# ------------------------------------------------------------------------------

services:
  # Safety: if these services start, do not bind host ports (legacy stack owns them).
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    depends_on: !reset []
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URL: postgresql://vsp:vsp@host.docker.internal:5432/vsp_phone_v4?schema=public
      REDIS_URL: redis://host.docker.internal:6379
      TLS_API_CERT_FILE: /etc/vsp/tls/api/fullchain.pem
      TLS_API_KEY_FILE: /etc/vsp/tls/api/privkey.pem
      TLS_CA_FILE: /etc/vsp/tls/ca/ca.crt
      KAMAILIO_HTTP_HOST: kamailio
      RTPENGINE_HOST: rtpengine
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"process.env.NODE_TLS_REJECT_UNAUTHORIZED='0'; fetch('https://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]

  admin:
    depends_on:
      api:
        condition: service_started

  kamailio:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      REDIS_HOST: host.docker.internal
      KAMAILIO_USRLOC_PERSISTENCE: postgres
      KAMAILIO_USRLOC_DB_URL: postgresql://vsp:vsp@host.docker.internal:5432/kamailio?schema=public
